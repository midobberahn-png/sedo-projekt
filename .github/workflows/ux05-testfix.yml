name: UX-05 Testfix
on:
  push:
    branches:
      - uiux-05-open-items-workqueue
    paths:
      - .github/workflows/ux05-testfix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/ux05-testfix.py
      - run: git diff --check
      - name: Testabhängigkeiten installieren
        working-directory: sedo_rechnungstool_v2
        run: |
          sed '/^faster-whisper/d' requirements.txt > "$RUNNER_TEMP/sedo-requirements.txt"
          python -m pip install 'Django~=5.2.0' -r "$RUNNER_TEMP/sedo-requirements.txt" >/dev/null
      - name: Zieltests
        working-directory: sedo_rechnungstool_v2
        run: |
          mkdir -p /tmp/sedo-ux05-fix/data
          DJANGO_SECRET_KEY=ux05-fix SEDO_HOME=/tmp/sedo-ux05-fix python manage.py test sedo.tests.test_review_v2.F11F66BatchMahnungNurMitAuswahlTests sedo.tests.test_open_items_v2 --noinput
      - name: Commit
        run: |
          git add sedo_rechnungstool_v2/sedo/tests/test_review_v2.py
          git config user.name 'SEDO UX'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'UX-05: F-11 Sichtbarkeitstest auf Arbeitswarteschlange aktualisieren'
          git push origin HEAD:uiux-05-open-items-workqueue
