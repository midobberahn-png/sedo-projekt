name: UX-01 Design System anwenden
on:
  push:
    branches:
      - uiux-01-design-system-v2
    paths:
      - .github/workflows/ux01-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design-System nach Legacy-CSS laden
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sedo_rechnungstool_v2/sedo/templates/sedo/base.html')
          s=p.read_text(encoding='utf-8')
          old='  <link rel="stylesheet" href="/static/sedo/app.css?v=3_24">\n'
          new=old+'  <link rel="stylesheet" href="/static/sedo/design-system-v2.css?v=1">\n'
          if s.count(old) != 1:
              raise SystemExit(f'Stylesheet-Anker {s.count(old)} statt 1')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
          git diff --check
      - name: Vertragstest ausführen
        working-directory: sedo_rechnungstool_v2
        run: |
          python -m pip install 'Django~=5.2.0' >/dev/null
          DJANGO_SECRET_KEY=ux01-test SEDO_HOME=/tmp/sedo-ux01 python manage.py test sedo.tests.test_design_system_v2 --noinput
      - name: Commit
        run: |
          git add sedo_rechnungstool_v2/sedo/templates/sedo/base.html
          git config user.name 'SEDO UX'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'UX-01: Design-System v2 global in der App-Shell aktivieren'
          git push origin HEAD:uiux-01-design-system-v2
