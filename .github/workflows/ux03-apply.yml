name: UX-03 State System anwenden
on:
  push:
    branches:
      - uiux-03-state-presentation
    paths:
      - .github/workflows/ux03-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/ux03-apply.py
      - run: git diff --check
      - name: Testabhängigkeiten installieren
        working-directory: sedo_rechnungstool_v2
        run: |
          sed '/^faster-whisper/d' requirements.txt > "$RUNNER_TEMP/sedo-requirements.txt"
          python -m pip install 'Django~=5.2.0' -r "$RUNNER_TEMP/sedo-requirements.txt" >/dev/null
      - name: UX-Vertrag testen
        working-directory: sedo_rechnungstool_v2
        run: |
          mkdir -p /tmp/sedo-ux03/data
          DJANGO_SECRET_KEY=ux03-test SEDO_HOME=/tmp/sedo-ux03 python manage.py test sedo.tests.test_design_system_v2 sedo.tests.test_app_shell_v2 sedo.tests.test_state_system_v2 --noinput
      - name: Commit
        run: |
          git add sedo_rechnungstool_v2/sedo/templates/sedo/base.html sedo_rechnungstool_v2/sedo/templates/sedo/invoice_list.html sedo_rechnungstool_v2/sedo/templates/sedo/open_items.html sedo_rechnungstool_v2/sedo/templates/sedo/dashboard.html sedo_rechnungstool_v2/sedo/templates/sedo/invoice_detail.html
          git config user.name 'SEDO UX'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'UX-03: Rechnungszustände nach H3 getrennt darstellen'
          git push origin HEAD:uiux-03-state-presentation
