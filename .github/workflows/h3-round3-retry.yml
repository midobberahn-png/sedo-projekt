name: H3 Runde 3 erneut anwenden
on:
  push:
    branches:
      - hardening-h3-zustandsmodell
    paths:
      - .github/workflows/h3-round3-retry.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/h3-round3-fix.py
      - run: python .github/h3-round3.py
      - run: python -m compileall -q sedo_rechnungstool_v2/sedo
      - run: git diff --check
      - name: Commit
        run: |
          git add sedo_rechnungstool_v2/sedo
          git config user.name 'SEDO H3'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'H3: Altverträge auf lifecycle und echte Zahlungswahrheit umstellen'
          git push origin HEAD:hardening-h3-zustandsmodell
