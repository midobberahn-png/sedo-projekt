name: UX-02 App Shell anwenden
on:
  push:
    branches:
      - uiux-02-app-shell-navigation
    paths:
      - .github/workflows/ux02-apply.yml
      - sedo_rechnungstool_v2/sedo/tests/test_app_shell_v2.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/ux02-apply.py
      - run: git diff --check
      - name: Testabhängigkeiten installieren
        working-directory: sedo_rechnungstool_v2
        run: |
          sed '/^faster-whisper/d' requirements.txt > "$RUNNER_TEMP/sedo-requirements.txt"
          python -m pip install 'Django~=5.2.0' -r "$RUNNER_TEMP/sedo-requirements.txt" >/dev/null
      - name: UX-Vertrag testen
        working-directory: sedo_rechnungstool_v2
        run: |
          mkdir -p /tmp/sedo-ux02/data
          DJANGO_SECRET_KEY=ux02-test SEDO_HOME=/tmp/sedo-ux02 python manage.py test sedo.tests.test_design_system_v2 sedo.tests.test_app_shell_v2 --noinput
      - name: Commit
        run: |
          git add sedo_rechnungstool_v2/sedo/templates/sedo/base.html
          git config user.name 'SEDO UX'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'UX-02: App-Shell, Navigation und Command-Bar neu ordnen'
          git push origin HEAD:uiux-02-app-shell-navigation
