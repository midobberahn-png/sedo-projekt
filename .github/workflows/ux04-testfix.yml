name: UX-04 Testfix
on:
  push:
    branches:
      - uiux-04-invoice-detail-actions
    paths:
      - .github/workflows/ux04-testfix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: python .github/ux04-testfix.py
      - run: git diff --check
      - name: Testabhängigkeiten installieren
        working-directory: sedo_rechnungstool_v2
        run: |
          sed '/^faster-whisper/d' requirements.txt > "$RUNNER_TEMP/sedo-requirements.txt"
          python -m pip install 'Django~=5.2.0' -r "$RUNNER_TEMP/sedo-requirements.txt" >/dev/null
      - name: Zieltests
        working-directory: sedo_rechnungstool_v2
        run: |
          mkdir -p /tmp/sedo-ux04-fix/data
          DJANGO_SECRET_KEY=ux04-fix SEDO_HOME=/tmp/sedo-ux04-fix python manage.py test sedo.tests.test_review_v2.F07ViewsUndSichtbarkeitTests.test_loeschknopf_ist_deaktiviert_wenn_gesperrt sedo.tests.test_invoice_detail_v2 --noinput
      - name: Commit
        run: |
          git add sedo_rechnungstool_v2/sedo/tests/test_review_v2.py
          git config user.name 'SEDO UX'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'UX-04: Sichtbarkeitstest auf Ausblenden-Sperre aktualisieren'
          git push origin HEAD:uiux-04-invoice-detail-actions
