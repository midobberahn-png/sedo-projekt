name: SEDO PR regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django ${{ matrix.django }} / macOS ARM64
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        django: ['5.2.17', '6.0.9']
    env:
      DJANGO_SECRET_KEY: nur-fuer-isolierte-ci-tests-kein-betriebsschluessel
      DJANGO_ALLOWED_HOSTS: testserver,127.0.0.1,localhost
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Apple-Silicon-Runner prüfen
        run: test "$(uname -m)" = arm64
      - name: Quellstand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.13.15 einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Isolierte Testumgebung installieren
        run: |
          echo "SEDO_HOME=$RUNNER_TEMP/sedo-ci" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sedo-ci/data"
          sed '/^[[:space:]]*faster-whisper[[:space:]]*$/d' requirements.txt > "$RUNNER_TEMP/sedo-ci-requirements.txt"
          sed '/^Django==/d' requirements-release-constraints.txt > "$RUNNER_TEMP/sedo-ci-constraints.txt"
          python -m pip install -r "$RUNNER_TEMP/sedo-ci-requirements.txt" -c "$RUNNER_TEMP/sedo-ci-constraints.txt" "Django==${{ matrix.django }}"
          python -m pip check
      - name: Lock und Konfiguration prüfen
        run: |
          python tools/teststand.py validate
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Regressionstests
        run: python manage.py test sedo --noinput

  web:
    name: Webprofil / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: config.settings_web
      DJANGO_SECRET_KEY: ci-web-key-only-for-synthetic-tests-1234567890-ABCdefGH
      SEDO_WEB_ORIGIN: https://rechnung.example.de
      DJANGO_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Quellstand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.13.15 einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Privaten synthetischen Datenordner anlegen
        run: |
          mkdir -p "$RUNNER_TEMP/sedo-web/data"
          chmod 700 "$RUNNER_TEMP/sedo-web" "$RUNNER_TEMP/sedo-web/data"
          echo "SEDO_HOME=$RUNNER_TEMP/sedo-web" >> "$GITHUB_ENV"
      - name: Web-Abhängigkeiten isoliert installieren
        run: |
          python -m pip install -r requirements_web.txt -c requirements-release-constraints.txt
          python -m pip check
      - name: Webprofil und Schema prüfen
        run: |
          python manage.py check --deploy
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          python -c "from config.wsgi import application; print('WSGI OK')"
      - name: Web-Regressionsprüfungen
        run: python manage.py test sedo.tests.test_web_mode --noinput
